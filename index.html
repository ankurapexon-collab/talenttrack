<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentTrack — Recruitment Toolkit (Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0F1424; --panel-dark:#171D30; --panel-dark-2:#1E2540;
    --paper:#F5F6FA; --panel-light:#FFFFFF;
    --border-light:#E3E6EF; --border-dark:#2A3252;
    --indigo:#4C5FD5; --indigo-soft:#E9EBFC;
    --amber:#F5A623; --amber-soft:#FFF3DE;
    --green:#2FAE6B; --green-soft:#E4F7ED;
    --red:#E5484D; --red-soft:#FDE7E7;
    --purple:#8B5CF6; --purple-soft:#F1EBFD;
    --teal:#0EA5A5; --teal-soft:#E1F6F6;
    --text-dark:#101425; --text-muted-dark:#5B6178;
    --text-light:#EDEFFA; --text-muted-light:#939AC0;
    --radius:10px;
    --font-display:'Space Grotesk',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }
  * { box-sizing:border-box; }
  html,body{margin:0;padding:0;}
  body{font-family:var(--font-body);background:var(--paper);color:var(--text-dark);min-height:100vh;transition:background .25s,color .25s;}
  body.dark{background:var(--ink);color:var(--text-light);}

  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:236px; flex-shrink:0;
    background:var(--panel-light); border-right:1px solid var(--border-light);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  body.dark .sidebar{background:var(--panel-dark); border-color:var(--border-dark);}
  .brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px 18px;}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--indigo),#7A87F0);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark svg{width:16px;height:16px;}
  .brand-name{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-0.01em;}
  .brand-tag{display:block;font-size:10px;font-family:var(--font-mono);color:var(--text-muted-light);margin-top:1px;}
  body.dark .brand-tag{color:var(--text-muted-dark);}

  .nav{padding:6px 10px; flex:1;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:8px; cursor:pointer;
    font-size:13.5px; font-weight:500; color:var(--text-muted-light);
    margin-bottom:2px; border:none; background:transparent; width:100%; text-align:left;
    font-family:var(--font-body);
  }
  .nav-item .emoji{font-size:15px; width:18px; text-align:center;}
  .nav-item:hover{background:var(--indigo-soft); color:var(--indigo);}
  body.dark .nav-item{color:var(--text-muted-dark);}
  body.dark .nav-item:hover{background:rgba(76,95,213,0.15); color:#A6B0F5;}
  .nav-item.active{background:var(--indigo); color:white;}
  body.dark .nav-item.active{background:var(--indigo); color:white;}

  .sidebar-foot{padding:14px; border-top:1px solid var(--border-light);}
  body.dark .sidebar-foot{border-color:var(--border-dark);}
  .key-status{
    display:flex; align-items:center; gap:8px; padding:9px 10px;
    border-radius:8px; background:var(--paper); font-size:11.5px; cursor:pointer;
    border:1px solid var(--border-light);
  }
  body.dark .key-status{background:var(--ink); border-color:var(--border-dark);}
  .key-dot{width:7px;height:7px;border-radius:50%;background:var(--red); flex-shrink:0;}
  .key-dot.on{background:var(--green);}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; border-bottom:1px solid var(--border-light);
    position:sticky; top:0; background:var(--paper); z-index:20;
  }
  body.dark .topbar{background:var(--ink); border-color:var(--border-dark);}
  .topbar h1{font-family:var(--font-display); font-size:19px; font-weight:700; margin:0;}
  .topbar p{margin:2px 0 0 0; font-size:12.5px; color:var(--text-muted-light);}
  body.dark .topbar p{color:var(--text-muted-dark);}
  .toggle-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border-light);background:var(--panel-light);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-dark);}
  body.dark .toggle-btn{background:var(--panel-dark-2); border-color:var(--border-dark); color:var(--text-light);}
  .toggle-btn svg{width:16px;height:16px;}

  .shell{max-width:1100px; margin:0 auto; padding:26px 28px 50px 28px;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---------- Shared components ---------- */
  .card{background:var(--panel-light); border:1px solid var(--border-light); border-radius:var(--radius); padding:20px;}
  body.dark .card{background:var(--panel-dark); border-color:var(--border-dark);}
  .card + .card{margin-top:16px;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:800px){.two-col{grid-template-columns:1fr;}}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--text-muted-light);}
  body.dark .field label{color:var(--text-muted-dark);}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border-light);
    background:var(--paper); color:inherit; font-family:var(--font-body); font-size:13.5px;
  }
  body.dark .field input, body.dark .field select, body.dark .field textarea{background:var(--ink); border-color:var(--border-dark);}
  .field textarea{resize:vertical; min-height:80px; font-family:var(--font-body);}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--indigo); outline-offset:-1px;}
  .hint{font-size:11.5px; color:var(--text-muted-light); margin-top:4px;}
  body.dark .hint{color:var(--text-muted-dark);}

  .btn-primary{font-family:var(--font-body);font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:var(--radius);border:none;background:var(--indigo);color:white;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
  .btn-primary:hover{background:#3E4FC0;}
  .btn-primary:disabled{opacity:0.55; cursor:not-allowed;}
  .btn-ghost{padding:10px 16px;border-radius:var(--radius);border:1px solid var(--border-light);background:transparent;color:inherit;font-family:var(--font-body);font-weight:600;font-size:13.5px;cursor:pointer;}
  body.dark .btn-ghost{border-color:var(--border-dark);}
  .btn-small{font-size:12px; padding:6px 12px;}

  .section-title{font-family:var(--font-display); font-size:16px; font-weight:700; margin:0 0 4px 0;}
  .section-sub{font-size:12.5px; color:var(--text-muted-light); margin:0 0 16px 0;}
  body.dark .section-sub{color:var(--text-muted-dark);}

  .ai-badge{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--purple); background:var(--purple-soft); padding:3px 9px; border-radius:20px; margin-left:8px; vertical-align:middle;}
  body.dark .ai-badge{background:rgba(139,92,246,0.18);}

  .key-warning{display:flex; gap:10px; align-items:flex-start; background:var(--amber-soft); border:1px solid rgba(245,166,35,0.35); padding:12px 14px; border-radius:8px; font-size:12.5px; margin-bottom:16px;}
  body.dark .key-warning{background:rgba(245,166,35,0.1);}
  .key-warning svg{width:16px; height:16px; flex-shrink:0; margin-top:1px; color:var(--amber);}

  .output-box{
    background:var(--paper); border:1px solid var(--border-light); border-radius:8px;
    padding:16px; margin-top:14px; font-size:13.5px; line-height:1.6; white-space:pre-wrap;
    min-height:60px;
  }
  body.dark .output-box{background:var(--ink); border-color:var(--border-dark);}
  .output-box.empty{color:var(--text-muted-light); font-style:italic;}
  body.dark .output-box.empty{color:var(--text-muted-dark);}
  .output-actions{display:flex; gap:8px; margin-top:10px;}

  .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,0.4);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Pipeline / CRM (from base) ---------- */
  .pipeline{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:20px;}
  @media(max-width:800px){.pipeline{grid-template-columns:repeat(2,1fr);}}
  .stage-card{background:var(--panel-light); border:1px solid var(--border-light); border-radius:var(--radius); padding:14px 16px; cursor:pointer; position:relative; overflow:hidden;}
  body.dark .stage-card{background:var(--panel-dark); border-color:var(--border-dark);}
  .stage-card.active{border-color:var(--stage-color, var(--indigo));}
  .stage-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stage-color,var(--indigo));}
  .stage-count{font-family:var(--font-mono); font-size:24px; font-weight:500; line-height:1;}
  .stage-label{font-size:11.5px; font-weight:600; color:var(--text-muted-light); text-transform:uppercase; letter-spacing:0.04em; margin-top:6px;}
  body.dark .stage-label{color:var(--text-muted-dark);}

  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap;}
  .search-box{flex:1; min-width:200px; position:relative;}
  .search-box svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-muted-light);}
  body.dark .search-box svg{color:var(--text-muted-dark);}
  .search-box input{width:100%; padding:10px 14px 10px 36px; border-radius:var(--radius); border:1px solid var(--border-light); background:var(--panel-light); color:inherit; font-size:13.5px;}
  body.dark .search-box input{background:var(--panel-dark); border-color:var(--border-dark);}

  table{width:100%; border-collapse:collapse;}
  thead th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted-light); padding:12px 14px; border-bottom:1px solid var(--border-light); font-weight:600;}
  body.dark thead th{color:var(--text-muted-dark); border-color:var(--border-dark);}
  tbody td{padding:13px 14px; border-bottom:1px solid var(--border-light); font-size:13px; vertical-align:middle;}
  body.dark tbody td{border-color:var(--border-dark);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(76,95,213,0.04);}
  .cand-name{font-weight:600;}
  .cand-id{font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted-light);}
  body.dark .cand-id{color:var(--text-muted-dark);}
  .stage-pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px 4px 8px; border-radius:20px; font-size:11.5px; font-weight:600; background:var(--pill-bg,var(--indigo-soft)); color:var(--pill-fg,var(--indigo));}
  .stage-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .skill-tag{display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:12px; background:var(--indigo-soft); color:var(--indigo); margin:2px 3px 0 0;}
  body.dark .skill-tag{background:rgba(76,95,213,0.18);}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border-light);background:transparent;color:var(--text-muted-light);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .icon-btn:hover{background:var(--indigo-soft); color:var(--indigo); border-color:transparent;}
  .icon-btn.danger:hover{background:var(--red-soft); color:var(--red);}
  body.dark .icon-btn{border-color:var(--border-dark); color:var(--text-muted-dark);}
  .icon-btn svg{width:13px;height:13px;}
  .table-wrap{background:var(--panel-light); border:1px solid var(--border-light); border-radius:var(--radius); overflow:hidden;}
  body.dark .table-wrap{background:var(--panel-dark); border-color:var(--border-dark);}
  .empty-state{text-align:center; padding:50px 20px; color:var(--text-muted-light);}
  body.dark .empty-state{color:var(--text-muted-dark);}

  select.filter-select{padding:10px 14px; border-radius:var(--radius); border:1px solid var(--border-light); background:var(--panel-light); color:inherit; font-size:13.5px; cursor:pointer;}
  body.dark select.filter-select{background:var(--panel-dark); border-color:var(--border-dark);}

  /* ---------- Modal ---------- */
  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(15,20,36,0.55); z-index:100; align-items:center; justify-content:center; padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--panel-light); border-radius:14px; width:100%; max-width:480px; padding:26px; max-height:88vh; overflow-y:auto;}
  body.dark .modal{background:var(--panel-dark-2);}
  .modal h2{font-family:var(--font-display); font-size:18px; margin:0 0 18px 0;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:20px;}

  /* ---------- Analytics ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
  @media(max-width:800px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-card{background:var(--panel-light); border:1px solid var(--border-light); border-radius:var(--radius); padding:16px;}
  body.dark .stat-card{background:var(--panel-dark); border-color:var(--border-dark);}
  .stat-value{font-family:var(--font-mono); font-size:26px; font-weight:500;}
  .stat-label{font-size:11px; color:var(--text-muted-light); text-transform:uppercase; letter-spacing:0.04em; margin-top:4px;}
  body.dark .stat-label{color:var(--text-muted-dark);}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .bar-label{width:110px; font-size:12.5px; font-weight:500; flex-shrink:0;}
  .bar-track{flex:1; height:10px; background:var(--paper); border-radius:6px; overflow:hidden;}
  body.dark .bar-track{background:var(--ink);}
  .bar-fill{height:100%; border-radius:6px; background:var(--indigo);}
  .bar-value{width:42px; text-align:right; font-family:var(--font-mono); font-size:12px; color:var(--text-muted-light); flex-shrink:0;}
  body.dark .bar-value{color:var(--text-muted-dark);}

  /* ---------- Chat (AI Recruiter) ---------- */
  .chat-window{height:420px; overflow-y:auto; padding:6px 4px; display:flex; flex-direction:column; gap:12px;}
  .chat-msg{max-width:80%; padding:10px 14px; border-radius:12px; font-size:13.5px; line-height:1.5;}
  .chat-msg.user{align-self:flex-end; background:var(--indigo); color:white; border-bottom-right-radius:3px;}
  .chat-msg.assistant{align-self:flex-start; background:var(--paper); border-bottom-left-radius:3px;}
  body.dark .chat-msg.assistant{background:var(--panel-dark-2);}
  .chat-input-row{display:flex; gap:10px; margin-top:14px;}
  .chat-input-row input{flex:1;}

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border-light); border-radius:4px;}
  body.dark ::-webkit-scrollbar-thumb{background:var(--border-dark);}

  .dropzone{
    border:2px dashed var(--border-light); border-radius:10px; padding:22px 16px;
    text-align:center; cursor:pointer; transition:border-color .15s, background .15s;
    margin-bottom:14px;
  }
  body.dark .dropzone{border-color:var(--border-dark);}
  .dropzone:hover, .dropzone.drag-over{border-color:var(--indigo); background:var(--indigo-soft);}
  body.dark .dropzone.drag-over{background:rgba(76,95,213,0.12);}
  .dropzone svg{width:22px;height:22px; color:var(--text-muted-light); margin-bottom:6px;}
  body.dark .dropzone svg{color:var(--text-muted-dark);}
  .dropzone-text{font-size:12.5px; color:var(--text-muted-light); font-weight:500;}
  body.dark .dropzone-text{color:var(--text-muted-dark);}
  .dropzone-sub{font-size:11px; color:var(--text-muted-light); margin-top:2px;}
  body.dark .dropzone-sub{color:var(--text-muted-dark);}
  .dropzone.small{padding:12px; margin-bottom:0;}
  .file-chip{display:inline-flex; align-items:center; gap:7px; background:var(--indigo-soft); color:var(--indigo); font-size:12px; font-weight:600; padding:5px 10px 5px 8px; border-radius:20px; margin-top:8px;}
  body.dark .file-chip{background:rgba(76,95,213,0.18);}
  .file-chip button{background:none; border:none; color:inherit; cursor:pointer; font-weight:700; padding:0 2px; font-size:13px;}
  .parse-status{font-size:12px; margin-top:8px; color:var(--text-muted-light);}
  body.dark .parse-status{color:var(--text-muted-dark);}
  .parse-status.ok{color:var(--green);}
  .parse-status.err{color:var(--red);}
  .job-card{background:var(--panel-light); border:1px solid var(--border-light); border-radius:var(--radius); padding:16px; cursor:pointer;}
  body.dark .job-card{background:var(--panel-dark); border-color:var(--border-dark);}
  .job-card.active{border-color:var(--indigo); box-shadow:0 0 0 1px var(--indigo);}
  .job-card h3{font-family:var(--font-display); font-size:15px; margin:0 0 3px 0;}
  .job-card .job-meta{font-size:12px; color:var(--text-muted-light);}
  body.dark .job-card .job-meta{color:var(--text-muted-dark);}
  .job-status-pill{display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; padding:3px 9px; border-radius:20px; margin-top:8px;}
  .job-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin-bottom:20px;}
  .toast{position:fixed; bottom:24px; right:24px; background:var(--green); color:white; padding:11px 18px; border-radius:8px; font-size:13px; font-weight:600; z-index:200; box-shadow:0 6px 20px rgba(0,0,0,0.2); display:none;}
  .toast.show{display:block;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"><path d="M4 12h4l2 5 4-14 2 9h4"/></svg></div>
      <div><span class="brand-name">TalentTrack</span><span class="brand-tag">PROTOTYPE</span></div>
    </div>
    <div class="nav" id="navList"></div>
    <div class="sidebar-foot">
      <div class="key-status" id="keyStatusBtn" style="cursor:default;">
        <span class="key-dot on"></span>
        <span>AI tools need the backend deployed — see DEPLOY.md</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="viewTitle">Candidate Pipeline</h1>
        <p id="viewSub">Your recruitment CRM</p>
      </div>
      <button class="toggle-btn" id="themeToggle">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <div class="shell" id="shell"></div>
  </div>
</div>

<!-- Candidate modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Add Candidate</h2>
    <div class="field">
      <label>Attach resume (optional — auto-fills the fields below)</label>
      <div class="dropzone" id="candDropzone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 16V4M12 4 7 9M12 4l5 5M4 20h16"/></svg>
        <div class="dropzone-text">Drag & drop a resume, or click to browse</div>
        <div class="dropzone-sub">.pdf, .docx, or .txt</div>
      </div>
      <input type="file" id="candFileInput" accept=".pdf,.docx,.txt" style="display:none;">
      <div id="candFileChipWrap"></div>
      <div class="parse-status" id="candParseStatus"></div>
    </div>
    <form id="candidateForm">
      <input type="hidden" id="candidateId">
      <input type="hidden" id="candResumeTextHidden">
      <div class="field"><label>Full name</label><input type="text" id="fullName" required placeholder="e.g. Priya Sharma"></div>
      <div class="field"><label>Role applied for</label><input type="text" id="roleApplied" required placeholder="e.g. Senior Backend Engineer"></div>
      <div class="field"><label>Email</label><input type="email" id="email" required placeholder="priya@email.com"></div>
      <div class="field"><label>Phone (optional)</label><input type="text" id="phone" placeholder="+91 98765 43210"></div>
      <div class="field"><label>Skills (comma separated)</label><input type="text" id="skills" placeholder="Python, AWS, Kubernetes"></div>
      <div class="two-col">
        <div class="field"><label>Pipeline stage</label>
          <select id="stage">
            <option value="applied">Applied</option><option value="screening">Screening</option>

async function callClaude(systemPrompt, userPrompt){
  let res;
  try{
    res = await fetch('/api/chat', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ system: systemPrompt, prompt: userPrompt })
    });
  }catch(networkErr){
    throw new Error('Can\'t reach the AI backend. This works once this app is deployed to Vercel with the /api/chat function — see DEPLOY.md.');
  }
  let data;
  try{ data = await res.json(); }catch(e){ data = {}; }
  if(!res.ok){
    throw new Error(data?.error || ('Backend request failed with status '+res.status));
  }
  return data?.text?.trim() || '(No response text returned)';
}

/* =========================================================
   FILE TEXT EXTRACTION (.txt / .pdf / .docx)
========================================================= */
async function extractTextFromFile(file){
  const name = file.name.toLowerCase();
  if(name.endsWith('.txt') || name.endsWith('.md')){
    return (await file.text()).trim();
  }
  if(name.endsWith('.pdf')){
    if(!window.pdfjsLib) throw new Error('PDF reader library did not load (check your internet connection) — try a .txt or .docx file instead.');
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = '';
    for(let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it=>it.str).join(' ') + '\n';
    }
    return text.trim();
  }
  if(name.endsWith('.docx')){
    if(!window.mammoth) throw new Error('DOCX reader library did not load (check your internet connection) — try a .txt or .pdf file instead.');
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    return result.value.trim();
  }
  throw new Error('Unsupported file type. Please use .pdf, .docx, or .txt — or paste the text directly.');
}

/* Wires drag-and-drop + click-to-browse behavior onto a dropzone element.
   onFile(file) is called once a file is selected/dropped. */
function wireDropzone(zoneEl, inputEl, onFile){
  zoneEl.onclick = () => inputEl.click();
  inputEl.onchange = () => { if(inputEl.files[0]) onFile(inputEl.files[0]); };
  ['dragenter','dragover'].forEach(evt => zoneEl.addEventListener(evt, (e)=>{
    e.preventDefault(); e.stopPropagation(); zoneEl.classList.add('drag-over');
  }));
  ['dragleave','drop'].forEach(evt => zoneEl.addEventListener(evt, (e)=>{
    e.preventDefault(); e.stopPropagation(); zoneEl.classList.remove('drag-over');
  }));
  zoneEl.addEventListener('drop', (e)=>{
    const file = e.dataTransfer.files[0];
    if(file) onFile(file);
  });
}

function showToast(msg, isError){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background = isError ? 'var(--red)' : 'var(--green)';
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 3200);
}

/* AI-assisted resume parsing: pulls structured fields out of raw resume text.
   Falls back gracefully — if no key or parsing fails, caller just keeps the raw text. */
async function aiParseResume(resumeText){
  const raw = await callClaude(
    'You extract structured candidate data from resume text. Respond ONLY with valid JSON, no markdown, no commentary, using exactly these keys: {"fullName":"","email":"","phone":"","skills":[],"roleGuess":""}. If a field is not found, use an empty string or empty array.',
    resumeText.slice(0, 6000)
  );
  const cleaned = raw.replace(/```json|```/g,'').trim();
  return JSON.parse(cleaned);
}

  const status = prompt('Status (open / on hold / closed):', existing?.status || 'open') || 'open';

async function handleResumeFile(file, targetJobId){
  const statusEl=document.getElementById('candParseStatus');
  document.getElementById('candFileChipWrap').innerHTML=`<span class="file-chip">📎 ${esc(file.name)}</span>`;
  statusEl.className='parse-status'; statusEl.textContent='Reading file...';
  try{
    const text = await extractTextFromFile(file);
    document.getElementById('candResumeTextHidden').value = text;
    document.getElementById('candidateForm').dataset.resumeFileName = file.name;
    if(!text){ statusEl.className='parse-status err'; statusEl.textContent='Could not find any text in that file — please fill fields manually.'; return; }
    statusEl.textContent='Reading resume with AI to auto-fill fields...';
    try{
      const parsed = await aiParseResume(text);
      if(parsed.fullName) document.getElementById('fullName').value=parsed.fullName;
      if(parsed.email) document.getElementById('email').value=parsed.email;
      if(parsed.phone) document.getElementById('phone').value=parsed.phone;
      if(Array.isArray(parsed.skills) && parsed.skills.length) document.getElementById('skills').value=parsed.skills.join(', ');
      if(parsed.roleGuess && !document.getElementById('roleApplied').value) document.getElementById('roleApplied').value=parsed.roleGuess;
      if(targetJobId) document.getElementById('candJobSelect').value=targetJobId;
      statusEl.className='parse-status ok'; statusEl.textContent='Fields auto-filled from resume — please double-check before saving.';
    }catch(parseErr){
      statusEl.className='parse-status err'; statusEl.textContent='File text extracted, but AI auto-fill failed ('+parseErr.message+'). Please fill fields manually.';
    }
  }catch(err){
    statusEl.className='parse-status err'; statusEl.textContent=err.message;
  }
}

    const results=candidates.filter(c=>{

      const mSkill=!skill || (c.skills||[]).includes(skill);

    });

    tbody.innerHTML='';
    if(results.length===0){ empty.style.display='block'; tbody.closest('table').style.display='none'; return; }
    empty.style.display='none'; tbody.closest('table').style.display='table';
    results.forEach(c=>{

      tbody.appendChild(tr);

  };

/* =========================================================
   8. BOOLEAN SEARCH GENERATOR (rule-based, no AI needed)
========================================================= */
function renderBooleanView(){
  const shell=document.getElementById('shell');
  shell.innerHTML=`
    <div class="card">
      <p class="section-sub">This one works instantly — no API key needed, it's built with simple rules, not AI. It generates several variants so you can try broad vs. narrow searches.</p>
      <div class="field"><label>Job titles (comma separated, alternates OK)</label><input type="text" id="boolTitles" placeholder="e.g. Backend Engineer, Software Engineer Backend"></div>
      <div class="two-col">
        <div class="field"><label>Must-have skills (comma separated)</label><input type="text" id="boolMust" placeholder="e.g. Python, AWS"></div>
        <div class="field"><label>Nice-to-have skills (comma separated)</label><input type="text" id="boolNice" placeholder="e.g. Kubernetes, Terraform"></div>
      </div>
      <div class="two-col">
        <div class="field"><label>Locations (comma separated)</label><input type="text" id="boolLocation" placeholder="e.g. Ahmedabad, Bangalore, Remote"></div>
        <div class="field"><label>Exclude terms (comma separated)</label><input type="text" id="boolExclude" placeholder="e.g. Intern, Junior"></div>
      </div>
      <button class="btn-primary" id="boolBtn">Generate Boolean Strings</button>
      <div id="boolResults"></div>
    </div>
  `;
  const buildList=(id)=>document.getElementById(id).value.split(',').map(s=>s.trim()).filter(Boolean);

  function group(list, joiner){ return list.length ? '(' + list.map(x=>`"${x}"`).join(` ${joiner} `) + ')' : ''; }

  function buildVariants(titles, must, nice, locs, excl){
    const variants=[];
    const titlePart = group(titles,'OR');
    const locPart = group(locs,'OR');
    const exclSuffix = excl.length ? ' NOT (' + excl.map(e=>`"${e}"`).join(' OR ') + ')' : '';

    // 1. Broad: titles AND each must-have AND (nice-to-haves OR'd) AND locations
    let parts=[];
    if(titlePart) parts.push(titlePart);
    must.forEach(m=>parts.push(`"${m}"`));
    if(nice.length) parts.push(group(nice,'OR'));
    if(locPart) parts.push(locPart);
    if(parts.length) variants.push({label:'Broad Search', desc:'Widest reach — all must-haves required, nice-to-haves optional.', str: parts.join(' AND ') + exclSuffix});

    // 2. Strict: everything ANDed together (most restrictive)
    let strictParts=[];
    if(titlePart) strictParts.push(titlePart);
    must.forEach(m=>strictParts.push(`"${m}"`));
    nice.forEach(n=>strictParts.push(`"${n}"`));
    if(locPart) strictParts.push(locPart);
    if(strictParts.length) variants.push({label:'Strict Search', desc:'Narrowest — every skill listed is required.', str: strictParts.join(' AND ') + exclSuffix});

    // 3. LinkedIn X-Ray style
    if(parts.length) variants.push({label:'LinkedIn X-Ray (Google)', desc:'Paste into Google to search LinkedIn profiles directly.', str: `site:linkedin.com/in/ ` + parts.join(' AND ') + exclSuffix});

    // 4. Title + top skills only (wider net)
    const topMust = must.slice(0,2);
    let widePart=[];
    if(titlePart) widePart.push(titlePart);
    topMust.forEach(m=>widePart.push(`"${m}"`));
    if(widePart.length) variants.push({label:'Wide Net (title + top skills only)', desc:'Use when the strict/broad searches return too few candidates.', str: widePart.join(' AND ') + exclSuffix});

    return variants;
  }

  document.getElementById('boolBtn').onclick=()=>{
    const titles=buildList('boolTitles'), must=buildList('boolMust'), nice=buildList('boolNice'), locs=buildList('boolLocation'), excl=buildList('boolExclude');
    const results=document.getElementById('boolResults');
    if(!titles.length && !must.length && !nice.length && !locs.length){
      results.innerHTML='<div class="output-box empty">Please fill in at least one field.</div>';
      return;
    }
    const variants=buildVariants(titles,must,nice,locs,excl);
    results.innerHTML = variants.map((v,i)=>`
      <div class="card" style="margin-top:14px;">
        <p class="section-title" style="font-size:14px;">${esc(v.label)}</p>
        <p class="section-sub">${esc(v.desc)}</p>
        <div class="output-box" id="boolOut${i}">${esc(v.str)}</div>
        <div class="output-actions"><button class="btn-ghost btn-small" data-copy="boolOut${i}">Copy to clipboard</button></div>
      </div>
    `).join('');
    results.querySelectorAll('[data-copy]').forEach(btn=>{
      btn.onclick=()=>{
        navigator.clipboard.writeText(document.getElementById(btn.getAttribute('data-copy')).textContent);
        btn.textContent='Copied!'; setTimeout(()=>btn.textContent='Copy to clipboard',1500);
      };
    });
  };
}

/* =========================================================
   9. INTERVIEW PLANNER (schedule = no AI, questions = AI)
========================================================= */
function renderInterviewView(){
  const shell=document.getElementById('shell');
  const scheduled=candidates.filter(c=>c.stage==='interview'||c.stage==='offer');
  shell.innerHTML=`
    <div class="card">
      <p class="section-title">Scheduled Interviews</p>
      <p class="section-sub">Candidates currently in the Interview or Offer stage. Set a date directly here.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Candidate</th><th>Role</th><th>Stage</th><th>Interview date</th></tr></thead>
        <tbody id="schedBody"></tbody>
      </table></div>
      ${scheduled.length===0?'<div class="empty-state"><p><strong>No one is in Interview/Offer stage yet.</strong> Add candidates via the CRM first.</p></div>':''}
    </div>
    <div class="card">
      <p class="section-title">Interview Question Generator <span class="ai-badge">AI</span></p>
      ${keyWarningHtml()}
      <div class="two-col">
        <div class="field"><label>Role</label><input type="text" id="ivRole" placeholder="e.g. Senior Backend Engineer"></div>
        <div class="field"><label>Focus area</label><select id="ivFocus"><option>Technical / hard skills</option><option>Behavioral / culture fit</option><option>System design</option><option>Leadership & ownership</option></select></div>
      </div>
      <button class="btn-primary" id="ivBtn">Generate Questions <span class="ai-badge">AI</span></button>
      <div class="output-box empty" id="ivOutput">Your generated interview questions will appear here.</div>
    </div>
  `;
  const body=document.getElementById('schedBody');
  scheduled.forEach(c=>{
    const info=stageInfo(c.stage);
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><div class="cand-name">${esc(c.fullName)}</div></td><td>${esc(c.roleApplied)}</td>
      <td><span class="stage-pill" style="--pill-bg:${info.bg}; --pill-fg:${info.color};">${info.label}</span></td>
      <td><input type="date" value="${c.interviewDate||''}" data-date="${c.id}"></td>`;
    body.appendChild(tr);
  });
  body.querySelectorAll('[data-date]').forEach(inp=>{
    inp.onchange=(e)=>{
      candidates=candidates.map(c=>c.id===inp.getAttribute('data-date')?{...c, interviewDate:e.target.value}:c);
      saveCandidates();
    };
  });
  document.getElementById('ivBtn').onclick=async ()=>{
    const role=document.getElementById('ivRole').value.trim();
    const focus=document.getElementById('ivFocus').value;
    const out=document.getElementById('ivOutput');
    if(!role){ out.textContent='Please enter a role.'; out.classList.add('empty'); return; }
    await runAiTask(document.getElementById('ivBtn'), out,
      'You are an expert interviewer. Produce a numbered list of 6-8 strong interview questions with a one-line note on what a good answer demonstrates for each.',
      `Generate interview questions for a ${role} role, focused on: ${focus}.`);
  };
}

/* =========================================================
   10. ANALYTICS (no AI)
========================================================= */
function renderAnalyticsView(){
  const shell=document.getElementById('shell');
  const total=candidates.length;
  const hired=candidates.filter(c=>c.stage==='hired').length;
  const inProgress=candidates.filter(c=>['screening','interview','offer'].includes(c.stage)).length;
  const roles={};
  candidates.forEach(c=>{ roles[c.roleApplied]=(roles[c.roleApplied]||0)+1; });
  const roleEntries=Object.entries(roles).sort((a,b)=>b[1]-a[1]);
  const maxRoleCount=Math.max(1,...roleEntries.map(r=>r[1]));

  shell.innerHTML=`
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">Total Candidates</div></div>
      <div class="stat-card"><div class="stat-value">${inProgress}</div><div class="stat-label">Active in Pipeline</div></div>
      <div class="stat-card"><div class="stat-value">${hired}</div><div class="stat-label">Hired</div></div>
      <div class="stat-card"><div class="stat-value">${total?Math.round(hired/total*100):0}%</div><div class="stat-label">Hire Conversion</div></div>
    </div>
    <div class="two-col">
      <div class="card">
        <p class="section-title">Pipeline by Stage</p>
        <div id="stageBar"></div>
      </div>
      <div class="card">
        <p class="section-title">Candidates by Role</p>
        <div id="roleBar"></div>
      </div>
    </div>
  `;
  const stageBar=document.getElementById('stageBar');
  STAGES.forEach(s=>{
    const count=candidates.filter(c=>c.stage===s.key).length;
    const pct=total?Math.round(count/total*100):0;
    const row=document.createElement('div'); row.className='bar-row';
    row.innerHTML=`<div class="bar-label">${s.label}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${s.color};"></div></div><div class="bar-value">${count}</div>`;
    stageBar.appendChild(row);
  });
  const roleBar=document.getElementById('roleBar');
  if(roleEntries.length===0){ roleBar.innerHTML='<p class="section-sub">No candidates yet.</p>'; }
  roleEntries.forEach(([role,count])=>{
    const pct=Math.round(count/maxRoleCount*100);
    const row=document.createElement('div'); row.className='bar-row';
    row.innerHTML=`<div class="bar-label" title="${esc(role)}">${esc(role.length>16?role.slice(0,15)+'…':role)}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div><div class="bar-value">${count}</div>`;
    roleBar.appendChild(row);
  });
}

/* =========================================================
   SHARED AI TASK RUNNER (button -> output box)
========================================================= */
async function runAiTask(btn, outEl, systemPrompt, userPrompt){
  const origHtml=btn.innerHTML;
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Working...';
  outEl.classList.remove('empty');
  try{
    const result=await callClaude(systemPrompt, userPrompt);
    outEl.textContent=result;
    btn.disabled=false; btn.innerHTML=origHtml;
    return true;
  }catch(err){
    outEl.textContent='Something went wrong: ' + err.message;
    outEl.classList.add('empty');
    btn.disabled=false; btn.innerHTML=origHtml;
    return false;
  }
}
